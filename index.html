<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Medicine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
       .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 24px; }
       .btn { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
       .btn-primary { background: #3498db; color: white; }
       .btn-danger { background: #e74c3c; color: white; }
       .btn-secondary { background: #95a5a6; color: white; }
       .btn-small { padding: 6px 12px; font-size: 12px; }
       .medicine-item { background: #f8f9fa; padding: 16px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #3498db; }
       .medicine-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
       .medicine-name { font-weight: 600; font-size: 18px; color: #2c3e50; }
       .medicine-actions { display: flex; gap: 8px; }
       .medicine-details { color: #7f8c8d; font-size: 14px; margin-bottom: 12px; }
       .orari-list { margin-top: 12px; }
       .orario-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; }
       .orario-time { font-weight: 500; }
       .orario-actions { display: flex; gap: 6px; }
       .form-group { margin-bottom: 16px; }
       .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #2c3e50; }
       .form-group input,.form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
       .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
       .modal.active { display: flex; }
       .modal-content { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
       .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
       .add-orario { display: flex; gap: 8px; margin-top: 12px; }
       .add-orario input { flex: 1; }
       .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Le mie Medicine</h1>
        <button class="btn btn-primary" onclick="openModal()">+ Aggiungi Medicina</button>
        <div id="medicineList" style="margin-top: 24px;"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nuova Medicina</h2>
                <button class="btn btn-secondary btn-small" onclick="closeModal()">✕</button>
            </div>
            <form id="medicineForm" onsubmit="saveMedicine(event)">
                <input type="hidden" id="medicineId">
                <div class="form-group">
                    <label>Nome Medicina</label>
                    <input type="text" id="medicineName" required>
                </div>
                <div class="form-group">
                    <label>Dosaggio</label>
                    <input type="text" id="medicineDosage" placeholder="es. 500mg" required>
                </div>
                <div class="form-group">
                    <label>Frequenza</label>
                    <input type="text" id="medicineFrequency" placeholder="es. 2 volte al giorno">
                </div>
                <div class="form-group">
                    <label>Note</label>
                    <textarea id="medicineNotes" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Orari di assunzione</label>
                    <div id="orariContainer"></div>
                    <div class="add-orario">
                        <input type="time" id="newOrario">
                        <button type="button" class="btn btn-secondary" onclick="addOrario()">Aggiungi</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">Salva Medicina</button>
            </form>
        </div>
    </div>

    <script>
        let medicines = JSON.parse(localStorage.getItem('medicines') || '[]');
        let editingId = null;
        let currentOrari = [];

        function renderMedicines() {
            const list = document.getElementById('medicineList');
            if (medicines.length === 0) {
                list.innerHTML = '<p style="color: #95a5a6; text-align: center; margin-top: 40px;">Nessuna medicina aggiunta</p>';
                return;
            }

            list.innerHTML = medicines.map(med => `
                <div class="medicine-item">
                    <div class="medicine-header">
                        <div class="medicine-name">${med.name}</div>
                        <div class="medicine-actions">
                            <button class="btn btn-secondary btn-small" onclick="editMedicine('${med.id}')">Modifica</button>
                            <button class="btn btn-danger btn-small" onclick="deleteMedicine('${med.id}')">Elimina</button>
                        </div>
                    <div class="medicine-details">
                        <strong>Dosaggio:</strong> ${med.dosage}<br>
                        ${med.frequency? `<strong>Frequenza:</strong> ${med.frequency}<br>` : ''}
                        ${med.notes? `<strong>Note:</strong> ${med.notes}` : ''}
                    </div>
                    ${med.orari && med.orari.length > 0? `
                        <div class="orari-list">
                            <strong style="font-size: 14px; color: #2c3e50;">Orari:</strong>
                            ${med.orari.map(o => `<div class="orario-item">
                                <span class="orario-time">${o}</span>
                            </div>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function openModal() {
            editingId = null;
            currentOrari = [];
            document.getElementById('modalTitle').textContent = 'Nuova Medicina';
            document.getElementById('medicineForm').reset();
            document.getElementById('medicineId').value = '';
            renderOrari();
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function editMedicine(id) {
            const med = medicines.find(m => m.id === id);
            if (!med) return;

            editingId = id;
            currentOrari = [...(med.orari || [])];
            document.getElementById('modalTitle').textContent = 'Modifica Medicina';
            document.getElementById('medicineId').value = med.id;
            document.getElementById('medicineName').value = med.name;
            document.getElementById('medicineDosage').value = med.dosage;
            document.getElementById('medicineFrequency').value = med.frequency || '';
            document.getElementById('medicineNotes').value = med.notes || '';
            renderOrari();
            document.getElementById('modal').classList.add('active');
        }

        function renderOrari() {
            const container = document.getElementById('orariContainer');
            container.innerHTML = currentOrari.map((orario, idx) => `
                <div class="orario-item" id="orario-${idx}">
                    <span class="orario-time" id="time-display-${idx}">${orario}</span>
                    <input type="time" class="hidden" id="time-edit-${idx}" value="${orario}">
                    <div class="orario-actions">
                        <button type="button" class="btn btn-secondary btn-small" id="edit-btn-${idx}" onclick="startEditOrario(${idx})">Modifica</button>
                        <button type="button" class="btn btn-primary btn-small hidden" id="save-btn-${idx}" onclick="saveOrario(${idx})">Salva</button>
                        <button type="button" class="btn btn-danger btn-small" onclick="deleteOrario(${idx})">Elimina</button>
                    </div>
                </div>
            `).join('');
        }

        function addOrario() {
            const input = document.getElementById('newOrario');
            if (input.value) {
                currentOrari.push(input.value);
                input.value = '';
                renderOrari();
            }
        }

        function startEditOrario(idx) {
            document.getElementById(`time-display-${idx}`).classList.add('hidden');
            document.getElementById(`time-edit-${idx}`).classList.remove('hidden');
            document.getElementById(`edit-btn-${idx}`).classList.add('hidden');
            document.getElementById(`save-btn-${idx}`).classList.remove('hidden');
        }

        function saveOrario(idx) {
            const newTime = document.getElementById(`time-edit-${idx}`).value;
            if (newTime) {
                currentOrari[idx] = newTime;
                renderOrari();
            }
        }

        function deleteOrario(idx) {
            currentOrari.splice(idx, 1);
            renderOrari();
        }

        function saveMedicine(e) {
            e.preventDefault();
            const medData = {
                id: editingId || Date.now().toString(),
                name: document.getElementById('medicineName').value,
                dosage: document.getElementById('medicineDosage').value,
                frequency: document.getElementById('medicineFrequency').value,
                notes: document.getElementById('medicineNotes').value,
                orari: [...currentOrari]
            };

            if (editingId) {
                const index = medicines.findIndex(m => m.id === editingId);
                medicines[index] = medData;
            } else {
                medicines.push(medData);
            }

            localStorage.setItem('medicines', JSON.stringify(medicines));
            renderMedicines();
            closeModal();
        }

        function deleteMedicine(id) {
            if (confirm('Eliminare questa medicina?')) {
                medicines = medicines.filter(m => m.id!== id);
                localStorage.setItem('medicines', JSON.stringify(medicines));
                renderMedicines();
            }
        }

        // Init
        renderMedicines();
    </script>
</body>
</html>
